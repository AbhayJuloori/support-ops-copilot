[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "support-ops-copilot"
version = "0.1.0"
description = "AI Support Operations Copilot — ticket classification, SLA prediction, LLM summarization"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
